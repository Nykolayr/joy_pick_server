<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Joy Pick — Website under reconstruction</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      background: radial-gradient(1200px 700px at 20% 0%, #eef2ff 0%, #ffffff 55%, #ffffff 100%);
      color: #0f172a;
    }
    .card {
      width: min(720px, 100%);
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.10);
      padding: 28px;
      text-align: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 22px;
      object-fit: contain;
      border: 1px solid #e5e7eb;
      background: #fff;
    }
    h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: -0.02em; }
    p { margin: 0; line-height: 1.6; color: #334155; font-size: 16px; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <img class="logo" src="/email-logo.png" alt="Joy Pick logo" />
    <h1>We’re rebuilding our website</h1>
    <p>
      The public site is temporarily unavailable while we prepare a new experience.
      The API continues to run normally.
    </p>
  </main>
</body>
</html>
